# Security — dependency vulnerability scan + secret scan.
#
# Deliberately a separate workflow from ci.yml, so its jobs never disturb the check
# names branch protection requires there. Runs on a schedule as well as on push/PR
# because a vulnerability disclosure is not an event in this repository — nothing
# here changes when a CVE lands against a pinned dependency, so a PR-only scan would
# stay green for as long as the repo is quiet.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Export the frozen lockfile
        run: |
          set -euo pipefail
          uv export --frozen --no-emit-project -o requirements-audit.txt
          echo "audited packages: $(grep -cE '^[A-Za-z0-9._-]+==' requirements-audit.txt)"
      - name: pip-audit (frozen lockfile)
        run: uvx pip-audit --requirement requirements-audit.txt --disable-pip --strict

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" \
            -o "$tarball"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xzf "$tarball" gitleaks
          ./gitleaks version
      - name: gitleaks (full history)
        run: ./gitleaks git --no-banner --redact --verbose .
      - name: gitleaks (working tree)
        run: ./gitleaks dir --no-banner --redact --verbose .
